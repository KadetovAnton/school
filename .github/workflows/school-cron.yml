# Розклад для звітів батькам: щогодини вдень смикає сервер школи.
# Сервер сам вирішує, що надіслати: повідомлення про незакінчені заняття
# і вечірній підсумок дня (о 20:00 за Києвом, один раз на день).
# Повторні виклики нічого не дублюють. Запустити вручну: Actions → school-cron → Run workflow.
name: school-cron
on:
  schedule:
    - cron: "7 6-19 * * *"   # UTC; це ≈ 8:07–21:07 за Києвом (взимку), 9:07–22:07 (влітку)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 https://school.akdtv.pp.ua/api/cron
